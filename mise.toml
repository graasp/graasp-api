[tools]
node = "24"

[hooks]
# Enabling corepack will install the `pnpm` package manager specified in your package.json
# alternatively, you can also install `pnpm` with mise
postinstall = 'npx corepack enable'

[settings]
# This must be enabled to make the hooks work
experimental = true

[env]
_.path = ['{{config_root}}/node_modules/.bin']
# The admin app (graasp/graasp-web) owns the database schema and its migrations.
# `mise run migrate` takes them from this admin commit or tag. Bump it when core
# needs a newer migration, once that migration is merged in admin.
ADMIN_REF = "167dd63c3823b4af27d05990e3dd15f348e43326"

[tasks.pnpm-install]
description = 'Installs dependencies with pnpm'
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.dev]
depends = ["pnpm-install"]
description = "Run the development server"
run = "pnpm watch"

[tasks.lint]
depends = ["pnpm-install"]
description = "Lint the files with eslint"
run = "eslint '**/*.{js,ts}'"

[tasks.prettier-check]
depends = ["pnpm-install"]
description = "Check formatting with prettier"
run = "prettier --check \"{src,test}/**/*.ts\""

[tasks.type-check]
depends = ["pnpm-install"]
description = "Run typescript checking"
run = "tsc --noEmit"

[tasks.check]
depends = ["prettier-check", "lint", "type-check"]

[tasks.build]
depends = ["lint"]
description = "Build the application"
run = "tsc -p tsconfig.build.json"

[tasks.migrate]
description = "Migrate the database with the admin app's migrations (see scripts/migrate.sh)"
run = "scripts/migrate.sh"
env = { _.file = '.env.development' }

[tasks.schema-drift-check]
description = "Check that src/drizzle/schema.ts matches the migrated database"
depends = ["pnpm-install"]
run = "ts-node --transpile-only src/drizzle/schemaDriftCheck.ts"
env = { _.file = '.env.development' }

[tasks.vitest]
depends = "pnpm-install"
run = "vitest"

[tasks.e2e]
depends = ["pnpm-install"]
env = { _.file = '.env.test'}
run = "jest --forceExit --verbose --coverage --silent --detectOpenHandles --maxWorkers=2"

[tasks.test]
depends = ["vitest", "e2e"]

[tasks.generate-db-docs]
depends = ["pnpm-install"]
description = "Generate documentation for the database schemas"
run = "drizzle-kit export > schema.sql && npx @liam-hq/cli erd build --input schema.sql --format postgres --output-dir db-documentation"
